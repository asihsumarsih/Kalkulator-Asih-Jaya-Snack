name: Build Android APK (Cordova)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Add Android
        run: |
          cordova create myapp com.example.kalkulator Kalkulator
          cd myapp
          # Pindahkan file www kalkulator kita ke proyek cordova
          rm -rf www/*
          cp -r ../www/* www/
          cordova platform add android

      - name: Build Android APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk