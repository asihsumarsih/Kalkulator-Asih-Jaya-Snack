name: Simple Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build with WebViewGold / Capacitor script
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install
          npx cap init Kalkulator com.example.kalkulator --web-dir www --yes
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk